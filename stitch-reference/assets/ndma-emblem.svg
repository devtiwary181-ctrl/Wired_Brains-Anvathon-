<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="50%" stop-color="#0B5FA5" />
      <stop offset="100%" stop-color="#002244" />
    </linearGradient>
    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield Base -->
  <path d="M24 3 L42 9.5 C42 24.5 34.5 37.5 24 44.5 C13.5 37.5 6 24.5 6 9.5 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Inner Protective Shield Border with Tricolor hint -->
  <path d="M24 5.5 L39.5 11.2 C39.5 23.8 33 35.2 24 41.5 C15 35.2 8.5 23.8 8.5 11.2 Z" 
        fill="none" 
        stroke="#FF9933" 
        stroke-width="1" 
        stroke-opacity="0.85"/>

  <!-- Ashoka Chakra (24-spoke Navy Wheel) at Core Top -->
  <g transform="translate(24, 18.5)">
    <!-- Outer Chakra Ring -->
    <circle r="8.2" fill="#FFFFFF" stroke="#003366" stroke-width="1.2" />
    <!-- Center Hub -->
    <circle r="1.8" fill="#003366" />
    <!-- Chakra 24 Spokes -->
    <g stroke="#003366" stroke-width="0.65" stroke-linecap="round">
      <line x1="0" y1="-8.2" x2="0" y2="8.2" />
      <line x1="-8.2" y1="0" x2="8.2" y2="0" />
      <line x1="-5.8" y1="-5.8" x2="5.8" y2="5.8" />
      <line x1="-5.8" y1="5.8" x2="5.8" y2="-5.8" />
      <!-- Intermediate spokes -->
      <line x1="-7.58" y1="-3.14" x2="7.58" y2="3.14" />
      <line x1="-3.14" y1="-7.58" x2="3.14" y2="7.58" />
      <line x1="-7.58" y1="3.14" x2="7.58" y2="-3.14" />
      <line x1="-3.14" y1="7.58" x2="3.14" y2="-7.58" />
      <!-- Additional spokes for realism -->
      <line x1="-8.06" y1="-1.6" x2="8.06" y2="1.6" />
      <line x1="-1.6" y1="-8.06" x2="1.6" y2="8.06" />
      <line x1="-8.06" y1="1.6" x2="8.06" y2="-1.6" />
      <line x1="-1.6" y1="8.06" x2="1.6" y2="-8.06" />
    </g>
    <!-- Chakra Rim Dots -->
    <circle cx="0" cy="-7.2" r="0.4" fill="#003366"/>
    <circle cx="7.2" cy="0" r="0.4" fill="#003366"/>
    <circle cx="0" cy="7.2" r="0.4" fill="#003366"/>
    <circle cx="-7.2" cy="0" r="0.4" fill="#003366"/>
  </g>

  <!-- Resilient Safety Wings / Waves supporting the Chakra -->
  <!-- Left Wing (Saffron gradient aura) -->
  <path d="M12 29 C15 32 19 33.5 24 34 C21.5 31.5 20 28.5 19.5 25.5 C16 26.5 13.5 27.5 12 29 Z" 
        fill="#FF9933" opacity="0.95"/>
  <!-- Right Wing (India Green aura) -->
  <path d="M36 29 C33 32 29 33.5 24 34 C26.5 31.5 28 28.5 28.5 25.5 C32 26.5 34.5 27.5 36 29 Z" 
        fill="#138808" opacity="0.95"/>

  <!-- Central Emergency Beacon / Star of Hope -->
  <path d="M24 33 L25.5 36.5 L29.5 37 L26.5 39.5 L27.5 43.5 L24 41 L20.5 43.5 L21.5 39.5 L18.5 37 L22.5 36.5 Z" 
        fill="url(#goldGrad)" 
        stroke="#ffffff" 
        stroke-width="0.5"/>
</svg>


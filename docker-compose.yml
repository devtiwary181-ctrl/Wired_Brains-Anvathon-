services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disasterready_postgres
    environment:
      POSTGRES_USER: disasterready
      POSTGRES_PASSWORD: disasterready_secret
      POSTGRES_DB: disasterready_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disasterready -d disasterready_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: disasterready_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
